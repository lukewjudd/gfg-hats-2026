<title>Good Food Guide Hats 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;500;600&display=swap">

<style>
/* Full-bleed map; floating panel top-left holds title + hat filters */
:root {
  --bg: #f6f4f1;
  --panel: rgba(255, 255, 255, 0.94);
  --fg: #22201d;
  --muted: #6d675f;
  --line: #e2ddd6;
  --hat1: #2f7d6d;
  --hat2: #d08a1e;
  --hat3: #b0263a;
  --new: #22201d;
  --display: "Fraunces", Georgia, serif;
  --body: "Work Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1a18; --panel: rgba(32, 30, 28, 0.94); --fg: #f1ede7; --muted: #a59e94; --line: #3a3733;
          --hat1: #4fb39f; --hat2: #f0a83a; --hat3: #e5536a; --new: #f1ede7; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--body); }
#map { position: absolute; inset: 0; background: var(--bg); }

.panel {
  position: absolute; z-index: 1000;
  top: max(12px, env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
  width: min(300px, calc(100vw - 24px));
  background: var(--panel); backdrop-filter: blur(6px);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; box-shadow: 0 4px 18px rgba(0,0,0,0.12);
  display: flex; flex-direction: column; gap: 10px;
}
h1 { font: 600 1.35rem/1.15 var(--display); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 0.82rem; margin: 0; }
.filters { display: flex; flex-direction: column; gap: 6px; }
.chip {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px;
  background: transparent; color: var(--fg); font: 500 0.9rem var(--body);
  cursor: pointer; text-align: left;
}
.chip:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.chip .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); flex: none; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--c); }
.chip .hats { letter-spacing: 0.02em; }
.chip .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="false"] { opacity: 0.45; }
.chip[aria-pressed="false"] .dot { background: transparent; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); cursor: pointer; }
.toggle input { accent-color: var(--fg); margin: 0; }
.panel summary { cursor: pointer; font-weight: 600; font-size: 0.85rem; }
.foot { font-size: 0.75rem; color: var(--muted); margin: 0; }
.foot a { color: inherit; }

.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--fg); }
.leaflet-popup-content { margin: 12px 14px; font: 14px/1.4 var(--body); }
.pop-name { font: 600 1.05rem/1.2 var(--display); margin: 0 0 2px; }
.pop-meta { color: var(--muted); margin: 0 0 6px; }
.pop-hats { font-weight: 600; color: var(--c); }
.badge { display: inline-block; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
         border: 1px solid var(--new); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; }
.pop-link { color: var(--fg); font-size: 0.85rem; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }

.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.panel-body { display: flex; flex-direction: column; gap: 10px; }
.collapse {
  display: none; align-items: center; gap: 6px; flex: none;
  padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px;
  background: transparent; color: var(--fg); font: 600 0.85rem var(--body); cursor: pointer;
}
.collapse:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.mini { display: inline-flex; gap: 3px; }
.mini i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chev { transition: transform 0.15s; }
.collapse[aria-expanded="false"] .chev { transform: rotate(-90deg); }

/* phones: panel spans the top edge and collapses to a single title row */
@media (max-width: 520px) {
  .panel { padding: 10px 12px; gap: 8px; width: auto; right: max(12px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 1.05rem; }
  .chip { padding: 5px 8px; }
  .collapse { display: inline-flex; }
  .panel.collapsed .panel-body, .panel.collapsed .sub { display: none; }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
</head>

</div>

const css = getComputedStyle(document.documentElement);
const COLOURS = { 1: css.getPropertyValue("--hat1").trim(), 2: css.getPropertyValue("--hat2").trim(), 3: css.getPropertyValue("--hat3").trim() };
const LABEL = { 1: "One hat", 2: "Two hats", 3: "Three hats" };
const dark = matchMedia("(prefers-color-scheme: dark)").matches;

const map = L.map("map", { zoomControl: false }).setView([-33.87, 151.2], 12);
L.control.zoom({ position: "bottomright" }).addTo(map);
// Stadia allows lukewjudd.github.io by domain (no key in the page); localhost works without setup
L.tileLayer(`https://tiles.stadiamaps.com/tiles/${dark ? "alidade_smooth_dark" : "alidade_smooth"}/{z}/{x}/{y}{r}.png`, {
  attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 20,
}).addTo(map);

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const markers = DATA.map(r => {
  const m = L.circleMarker([r.lat, r.lng], {
    radius: 5 + r.hats * 2, color: dark ? "#1b1a18" : "#ffffff", weight: 2,
    fillColor: COLOURS[r.hats], fillOpacity: 0.95,
  });
  const q = encodeURIComponent(`${r.name}, ${r.suburb}`);
  m.bindPopup(`
    <p class="pop-name">${esc(r.name)}${r.new ? '<span class="badge">New</span>' : ""}</p>
    <p class="pop-meta"><span class="pop-hats" style="--c:${COLOURS[r.hats]}">${LABEL[r.hats]}</span> · ${esc(r.suburb)}</p>
    <a class="pop-link" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Open in Google Maps ↗</a>`);
  m.bindTooltip(r.name, { direction: "top", offset: [0, -6] });
  m.data = r;
  return m;
});
// draw 3-hat markers on top
markers.sort((a, b) => a.data.hats - b.data.hats).forEach(m => m.addTo(map));

const active = new Set([1, 2, 3]);
const onlyNew = document.getElementById("onlyNew");

function refresh() {
  markers.forEach(m => {
    const show = active.has(m.data.hats) && (!onlyNew.checked || m.data.new);
    if (show && !map.hasLayer(m)) m.addTo(map);
    if (!show && map.hasLayer(m)) m.remove();
  });
  markers.filter(m => map.hasLayer(m) && m.data.hats === 3).forEach(m => m.bringToFront());
}

const filters = document.getElementById("filters");
[3, 2, 1].forEach(h => {
  const n = DATA.filter(r => r.hats === h).length;
  const b = document.createElement("button");
  b.className = "chip"; b.id = `hat-${h}`; b.setAttribute("aria-pressed", "true");
  b.style.setProperty("--c", COLOURS[h]);
  b.innerHTML = `<span class="dot"></span><span>${LABEL[h]}</span><span class="count">${n}</span>`;
  b.addEventListener("click", () => {
    active.has(h) ? active.delete(h) : active.add(h);
    b.setAttribute("aria-pressed", String(active.has(h)));
    refresh();
  });
  filters.appendChild(b);
});
onlyNew.addEventListener("change", () => { refresh(); renderMini(); });

// collapsed summary: one dot per hat level currently shown
const mini = document.getElementById("mini");
function renderMini() {
  mini.innerHTML = [3, 2, 1].filter(h => active.has(h)).map(h => `<i style="--c:${COLOURS[h]}"></i>`).join("");
}
renderMini();
filters.addEventListener("click", renderMini);

const panel = document.getElementById("panel");
const collapseBtn = document.getElementById("collapse");
function setCollapsed(c) {
  panel.classList.toggle("collapsed", c);
  collapseBtn.setAttribute("aria-expanded", String(!c));
}
collapseBtn.addEventListener("click", () => setCollapsed(!panel.classList.contains("collapsed")));
const phone = matchMedia("(max-width: 520px)");
setCollapsed(phone.matches);
phone.addEventListener("change", e => setCollapsed(e.matches));
document.getElementById("total").textContent = DATA.length;

// start on Sydney but make sure regional entries are reachable
if (DATA.length) map.fitBounds(L.latLngBounds(DATA.filter(r => r.region === "Sydney").map(r => [r.lat, r.lng])), { padding: [30, 30] });
